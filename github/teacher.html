<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>교사 페이지 · 반대 신문 질문</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .t-wrap { max-width: 1180px; }
    .login { max-width: 420px; margin: 40px auto; padding: 32px 28px; }
    .auto-toggle { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 0.9rem; margin: 0; color: var(--brown-600); }
    .auto-toggle input { accent-color: var(--brown-800); width: 16px; height: 16px; }
    .status-waiting { background: #F3EEE9; color: var(--brown-600); border: 1px solid var(--line); }
    .dropzone {
      border: 2px dashed var(--pink);
      border-radius: 18px;
      background: var(--white);
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 16px;
      transition: background 0.2s, border-color 0.2s;
    }
    .dropzone.over { background: var(--pink-light); border-color: var(--pink-deep); }
    .dropzone h2 { font-size: 1.25rem; margin-bottom: 6px; }
    .dropzone .btn { margin-top: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .load-report { margin-bottom: 16px; }
    .load-report ul { margin: 6px 0 0; padding-left: 1.2em; }
    .toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 18px; margin-bottom: 16px; align-items: end; }
    .toolbar label { font-size: 0.85rem; margin-bottom: 4px; }
    .toolbar input, .toolbar select { padding: 9px 12px; }
    .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 16px; align-items: center; }
    .toolbar-actions .meta { margin-right: auto; color: var(--brown-600); font-size: 0.9rem; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { padding: 18px 20px; }
    .stat h3 { font-size: 1rem; margin-bottom: 10px; }
    .bar-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 8px; align-items: center; font-size: 0.9rem; margin-bottom: 6px; }
    .bar { height: 10px; border-radius: 999px; background: var(--ivory); border: 1px solid var(--line); overflow: hidden; }
    .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--pink-deep)); }
    .bar-num { text-align: right; color: var(--brown-600); white-space: nowrap; }
    .big { font-family: var(--serif); font-size: 1.8rem; font-weight: 700; }
    .layout { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start; }
    .panel { padding: 0; overflow: hidden; }
    .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--line); font-family: var(--serif); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .student-list { max-height: 70vh; overflow-y: auto; }
    .student-item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 18px; font: inherit; color: inherit; cursor: pointer; }
    .student-item:hover { background: var(--ivory); }
    .student-item.active { background: var(--pink-light); }
    .student-item .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
    .student-item .sub { font-size: 0.85rem; color: var(--brown-600); }
    .status { font-size: 0.75rem; padding: 1px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
    .status-done { background: #E6EDE3; color: #34492F; }
    .status-progress { background: var(--pink-light); color: #7E3A43; }
    .status-conflict { background: #FBEDEE; color: #6A2A31; border: 1px solid #D9A0A6; }
    .detail { padding: 18px 20px; }
    .session { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
    .session > summary { cursor: pointer; padding: 12px 16px; background: var(--ivory); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; list-style: none; }
    .session > summary::-webkit-details-marker { display: none; }
    .session-body { padding: 16px; }
    .sec { margin-bottom: 18px; }
    .sec h4 { font-family: var(--serif); margin: 0 0 6px; font-size: 1rem; color: var(--brown-800); }
    .sec .box { background: var(--ivory); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .sec .box.scroll { max-height: 280px; overflow-y: auto; }
    .sec details.box summary { cursor: pointer; font-weight: 700; white-space: normal; }
    .timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--pink); }
    .timeline li { position: relative; padding: 4px 0 8px 12px; font-size: 0.92rem; }
    .timeline li::before { content: ''; position: absolute; left: -21px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--white); border: 2px solid var(--pink-deep); }
    .timeline .dur { color: var(--brown-600); font-size: 0.85rem; }
    .flag { font-size: 0.85rem; color: #6A2A31; background: #FBEDEE; border: 1px solid #D9A0A6; border-radius: 10px; padding: 6px 10px; margin-bottom: 12px; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .student-list { max-height: 360px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap t-wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">CX</span>
        <div>
          <p class="brand-eyebrow">Teacher Console</p>
          <h1 class="brand-title">반대 신문 활동 열람</h1>
        </div>
      </div>
      <a href="index.html" class="btn btn-ghost btn-sm">학생 페이지</a>
    </div>
  </header>

  <main class="wrap t-wrap">
    <div class="notice notice-warn" id="configNotice" hidden>config.js에 Apps Script 웹 앱 주소(API_URL)를 입력해 주세요.</div>

    <section class="card login" id="loginView">
      <h2>교사 로그인</h2>
      <p class="guide">교사 비밀번호를 입력하면 학생들의 활동 기록을 볼 수 있어요.</p>
      <form id="loginForm">
        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" type="password" inputmode="numeric" autocomplete="current-password" required>
          <p class="error" id="loginError" role="alert"></p>
        </div>
        <button type="submit" class="btn btn-primary" id="btnLogin" style="width:100%">열람하기</button>
      </form>
    </section>

    <section id="dashView" hidden>
      <div class="toolbar-actions">
        <span class="meta" id="metaText"></span>
        <label class="auto-toggle"><input type="checkbox" id="autoRefresh" checked> 30초마다 자동 새로고침</label>
        <button type="button" class="btn btn-ghost btn-sm" id="btnRefresh">지금 새로고침</button>
        <button type="button" class="btn btn-primary btn-sm" id="btnCsv">CSV 내려받기</button>
        <button type="button" class="btn btn-text" id="btnLogout">로그아웃</button>
      </div>

      <div class="card toolbar" role="search">
        <div><label for="fNumber">학번</label><input id="fNumber" type="text" placeholder="일부만 입력 가능"></div>
        <div><label for="fName">이름</label><input id="fName" type="text" placeholder="일부만 입력 가능"></div>
        <div><label for="fCategory">검토 관점</label>
          <select id="fCategory"><option value="">전체</option><option>타당성</option><option>공정성</option><option>신뢰성</option></select></div>
        <div><label for="fType">질문 유형</label>
          <select id="fType"><option value="">전체</option><option>확인 질문</option><option>검증 질문</option></select></div>
        <div><label for="fStatus">상태</label>
          <select id="fStatus"><option value="">전체</option><option value="done">완료</option><option value="waiting">피드백 대기</option><option value="writing">작성 중</option></select></div>
        <div><label for="fFrom">시작일</label><input id="fFrom" type="date"></div>
        <div><label for="fTo">종료일</label><input id="fTo" type="date"></div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="layout">
        <div class="card panel">
          <div class="panel-head"><span>학생 목록</span><span class="muted" id="studentCount"></span></div>
          <div class="student-list" id="studentList"></div>
        </div>
        <div class="card panel">
          <div class="panel-head"><span id="detailTitle">학생을 선택하세요</span></div>
          <div class="detail" id="detail"><p class="empty">왼쪽 목록에서 학생을 선택하면 활동 과정이 표시됩니다.</p></div>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
